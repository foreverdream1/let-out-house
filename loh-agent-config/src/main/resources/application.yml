server:
  port: 8082

spring:
  application:
    name: loh-agent-config

  servlet:
    multipart:
      max-file-size: 20MB        # 单文件上限
      max-request-size: 25MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://106.14.90.100:3306/let_out_house?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true"
    username: ${LOH_DB_USER:loh_app}
    password: ${LOH_DB_PASSWORD:666666}
    hikari:
      pool-name: ${spring.application.name}-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000

  data:
    redis:
      host: 106.14.90.100
      port: 6379
      password: ${LOH_REDIS_PASSWORD:666666}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: id
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.lethouse: debug

# 文档入库链路（本轮新增）
loh:
  rag:
    # Python 执行面的 rag-service
    base-url: http://127.0.0.1:8002
    # 文件落盘目录（Java 与 rag-service 同机共享；将来上对象存储改这里）
    storage-dir: ${LOH_STORAGE_DIR:D:/maven-project/let-out-house/data/documents}
    # 调 ingest 接口的超时（解析+向量化可能几十秒）
    ingest-timeout-seconds: 300

